[project]
name = "rent-seekers"
version = "0.1.0"
description = "NYC Rent Seekers — evidence-first NYCHA market-rent wedge map"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "pyarrow>=25.0.1",
    "pdfplumber>=0.11.10",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "jsonschema>=4.23",
    "pip-audit>=2.9",
]

[project.scripts]
rent-seekers = "rent_seekers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rent_seekers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
